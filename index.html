/* ---------- クイズの しくみ ---------- */
function roundFrom(pool, n = 3) {
  let last = null;
  return () => {
    let t; do { t = pick(pool); } while (pool.length > 1 && t === last);
    last = t;
    return { target: t, choices: shuffle([t, ...shuffle(pool.filter(x => x !== t)).slice(0, n - 1)]) };
  };
}
function quiz(el, o) {
  let cur, locked = false;
  el.innerHTML = `<div class="prompt"><div class="prompt-text"></div><button class="again" type="button" aria-label="もういちど きく">${ICON.speaker}</button></div><div class="choices"></div>`;
  const pt = $('.prompt-text', el), ch = $('.choices', el);
  $('.again', el).onclick = () => say(o.speak(cur.target));
  function next() {
    cur = o.makeRound(); locked = false;
    pt.innerHTML = o.prompt(cur.target);
    ch.style.setProperty('--n', cur.choices.length);
    ch.innerHTML = cur.choices.map((c, i) => `<button class="choice" type="button" data-i="${i}" aria-label="${o.name(c)}">${o.choice(c)}</button>`).join('');
    say(o.speak(cur.target));
  }
  ch.onclick = e => {
    const b = e.target.closest('.choice'); if (!b || locked) return;
    const c = cur.choices[+b.dataset.i];
    if (o.eq ? o.eq(c, cur.target) : c === cur.target) {
      locked = true; b.classList.add('right'); chime(); burst(b); addStar(); say(pick(PRAISE));
      setTimeout(() => { if (el.isConnected) next(); }, 1700);
    } else {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); boop();
      say(o.wrong ? o.wrong(c, cur.target) : `それは ${o.name(c)}。 ${o.speak(cur.target)}`);
    }
  };
  next();
}

const ORDER = ['iro', 'kazu', 'doubutsu', 'katachi', 'hiragana', 'oto'];
const state = { range: store.get('range', 5), mode: {} };

function countMode(el) {
  const n = 1 + Math.floor(Math.random() * state.range);
  const t = pick(THINGS);
  let k = 0;
  el.innerHTML = `<div class="tray">${Array(n).fill(0).map((_, i) => `<button class="thing" type="button" aria-label="${t.name}">${t.em}</button>`).join('')}</div><div class="result"><p class="hint">${t.name}を タップして かぞえよう</p></div>`;
  say(`${t.name}を かぞえよう`);
  $('.tray', el).onclick = e => {
    const b = e.target.closest('.thing'); if (!b || b.classList.contains('done')) return;
    k++; b.classList.add('done'); b.insertAdjacentHTML('beforeend', `<span class="badge">${k}</span>`); boing(b);
    tone(392 + k * 40, .25, 'sine', .15); say(NUMW[k]);
    if (k === n) {
      setTimeout(() => {
        if (!el.isConnected) return;
        chime(); addStar(); burst($('.tray', el));
        say(`ぜんぶで ${NUMW[n]}！ ${pick(PRAISE)}`);
        $('.result', el).innerHTML = `<span class="big">${n}</span><span style="font-size:24px">ぜんぶで ${n}こ！</span><button class="next" type="button">つぎ</button>`;
        $('.next', el).onclick = () => countMode(el);
      }, 650);
    }
  };
}

function pianoMode(el, guided) {
  let step = 0;
  el.innerHTML = (guided ? `<div class="lyrics">${KIRAKIRA.words.map((w, i) => `${i === 7 ? '<span class="gap"></span>' : ''}<span data-i="${i}">${w}</span>`).join('')}</div><p class="hint">★の けんばんを おしてね</p>` : '<p class="hint">すきな けんばんを おしてね</p>')
    + `<div class="keys">${NOTES.map((n, i) => `<button class="key" type="button" data-i="${i}" style="--kc:${n.c}">${n.n}</button>`).join('')}</div>`;
  const keys = [...el.querySelectorAll('.key')];
  const paint = () => {
    if (!guided) return;
    keys.forEach((b, i) => b.classList.toggle('guide', step < KIRAKIRA.notes.length && KIRAKIRA.notes[step] === i));
    el.querySelectorAll('.lyrics span[data-i]').forEach(s => { const i = +s.dataset.i; s.className = i < step ? 'done' : i === step ? 'now' : ''; });
  };
  const play = b => {
    const i = +b.dataset.i, nt = NOTES[i];
    tone(nt.f, .9, 'triangle', .3); tone(nt.f * 2, .5, 'sine', .05);
    b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 150);
    const r = b.getBoundingClientRect(), f = document.createElement('span');
    f.className = 'note-fly'; f.textContent = pick(['♪', '♫']); f.style.color = nt.c;
    f.style.left = (r.left + r.width / 2 - 10) + 'px'; f.style.top = (r.top + 10) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
    if (guided && step < KIRAKIRA.notes.length && KIRAKIRA.notes[step] === i) {
      step++; paint();
      if (step === KIRAKIRA.notes.length) setTimeout(() => {
        if (!el.isConnected) return;
        chime(); addStar(); burst($('.keys', el)); say('じょうずに ひけたね！');
        el.querySelector('.hint').innerHTML = '<button class="next" type="button">もういっかい</button>';
        $('.next', el).onclick = () => pianoMode(el, true);
      }, 700);
    }
  };
  $('.keys', el).addEventListener('pointerdown', e => { const b = e.target.closest('.key'); if (b) { e.preventDefault(); play(b); } });
  $('.keys', el).addEventListener('click', e => { const b = e.target.closest('.key'); if (b && e.detail === 0) play(b); });
  paint();
}

const app = $('#app');
function topBar(inner) {
  return `<header class="top">${inner}<span class="pill" title="あつめた ほし"><span class="st">★</span><span id="starCount">${stars}</span></span>
    <button class="pill btn" id="soundBtn" type="button" aria-pressed="${soundOn}" aria-label="おと">${soundOn ? ICON.speaker : ICON.mute}${soundOn ? 'おと あり' : 'おと なし'}</button></header>`;
}
function bindSound() {
  $('#soundBtn').onclick = e => {
    soundOn = !soundOn; store.set('sound', soundOn);
    const b = e.currentTarget; b.setAttribute('aria-pressed', soundOn); b.innerHTML = (soundOn ? ICON.speaker : ICON.mute) + (soundOn ? 'おと あり' : 'おと なし');
    if (soundOn) { actx(); say('おと あり'); } else { try { speechSynthesis.cancel(); } catch (e) {} }
  };
}
function renderHome() {
  document.body.style.removeProperty('--pc');
  app.innerHTML = topBar('<h1>あそんでまなぼ</h1>') + `
    <div class="hello"><p>2〜4さい むけの あそびばです。タップすると こえで おしえてくれるよ。せいかいすると ★が たまります。</p></div>
    <nav class="tiles">${ORDER.map(id => { const p = PAGES[id]; return `<a class="tile" href="#${id}" style="background:${p.color}"><span class="pic">${TILE_PIC[id]}</span><b>${p.title}</b><small>${p.sub}</small></a>`; }).join('')}</nav>
    <div class="note"><b>おうちの方へ</b>　各ページに「さわる（ずかん）」と「クイズ」があります。2さいは「さわる」で名前を聞くところから、3〜4さいは「クイズ」がおすすめです。音声はブラウザの読み上げ機能を使うので、音が出ないときは端末のマナーモードや音量を確認してください。<br>年中〜年長さん向けには、小学校受験のペーパー対策ができる <a href="https://kfukuzumi1119-debug.github.io/kids-asobi/juken/" style="color:var(--c-katachi)">おうちじゅけんドリル</a> もあります。</div>`;
  bindSound();
}
function renderPage(id) {
  const p = PAGES[id], names = Object.keys(p.modes);
  const mode = state.mode[id] && p.modes[state.mode[id]] ? state.mode[id] : names[0];
  app.style.setProperty('--pc', p.color);
  app.innerHTML = topBar(`<a class="back" href="#">${ICON.home}もどる</a><h1 style="color:${p.color}">${p.title}</h1>`) + `
    <div class="modes">${names.map(m => `<button class="mode" type="button" data-m="${m}" aria-pressed="${m === mode}">${m}</button>`).join('')}</div>
    ${p.extra ? p.extra() : ''}
    <section class="stage"></section>`;
  bindSound();
  const stage = $('.stage');
  p.modes[mode](stage);
  app.querySelectorAll('.mode').forEach(b => b.onclick = () => { state.mode[id] = b.dataset.m; actx(); renderPage(id); });
  app.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { state.range = +b.dataset.range; store.set('range', state.range); renderPage(id); });
}
function route() {
  try { speechSynthesis.cancel(); } catch (e) {}
  const id = location.hash.slice(1);
  if (PAGES[id]) renderPage(id); else { app.style.removeProperty('--pc'); renderHome(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.addEventListener('pointerdown', () => actx(), { once: true });
route();
</script>
