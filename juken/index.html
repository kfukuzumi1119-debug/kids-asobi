<noscript><h1>おうちじゅけんドリル</h1><p>小学校受験のペーパー対策（数量・図形・推理・位置・記憶・言語・常識）の無料問題です。JavaScript をオンにすると使えます。</p></noscript>

<script>
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const rint = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, k) => shuffle(a).slice(0, k);
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const store = {
  get(k, d) { try { const v = localStorage.getItem('juken.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('juken.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- こえ と おと ---------- */
let soundOn = store.get('sound', true), ac, jaVoice = null;
function actx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, d = .4, type = 'sine', v = .18, w = 0) {
  if (!soundOn) return; const a = actx(); if (!a) return;
  const t = a.currentTime + w, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const chime = () => { tone(784, .25); tone(1047, .45, 'sine', .18, .12); };
const boop = () => tone(196, .3, 'sine', .15);
function loadVoices() { try { jaVoice = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)) || null; } catch (e) {} }
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
const plain = s => s.replace(/<[^>]+>/g, '').replace(/[\u{1F000}-\u{1FAFF}☀-➿️]/gu, '');
function say(text, onend) {
  if (!soundOn || !text) { onend && onend(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = 'ja-JP'; u.rate = .9; u.pitch = 1.05; if (jaVoice) u.voice = jaVoice;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  } catch (e) { onend && onend(); }
}
const hush = () => { try { speechSynthesis.cancel(); } catch (e) {} };

/* ---------- ことば と え ---------- */
const VOCAB = [
  ['いぬ','🐶'],['ねこ','🐱'],['うさぎ','🐰'],['くま','🐻'],['ぱんだ','🐼'],['ごりら','🦍'],['らいおん','🦁'],['きりん','🦒'],['ぞう','🐘'],['さる','🐵'],
  ['ぶた','🐷'],['うし','🐮'],['うま','🐴'],['ひつじ','🐑'],['かえる','🐸'],['かめ','🐢'],['へび','🐍'],['わに','🐊'],['たこ','🐙'],['いか','🦑'],
  ['かに','🦀'],['くじら','🐳'],['いるか','🐬'],['ひよこ','🐤'],['ぺんぎん','🐧'],['あり','🐜'],['りす','🐿️'],['こあら','🐨'],['とら','🐯'],['ねずみ','🐭'],
  ['しまうま','🦓'],['かば','🦛'],['らくだ','🐫'],['ふくろう','🦉'],['あひる','🦆'],['にわとり','🐔'],['はち','🐝'],['かたつむり','🐌'],['てんとうむし','🐞'],
  ['りんご','🍎'],['みかん','🍊'],['ばなな','🍌'],['いちご','🍓'],['ぶどう','🍇'],['すいか','🍉'],['もも','🍑'],['めろん','🍈'],['れもん','🍋'],['なし','🍐'],

const E = (e, cls = '') => `<span class="e ${cls}">${e}</span>`;

function nearNums(n, min, max, k) {

}

/* もんだいの かたち: correct を1つ、wrongs を並べると、まぜて こたえの ばしょを きめる */

const randPat = k => { const p = Array(9).fill(0); sample(range(0, 8), k).forEach(i => p[i] = 1); return p; };

  return out;

    <nav class="secs">${ORDER.map(id => card(id, SECTIONS[id])).join('')}${card('mix', { t: 'ミックス', k: '総合', d: '7つの ぶんやから まぜて 10もん', c: '#1F7A5A', ic: '全' })}</nav>
    <section class="parents"><h2>おうちの方へ</h2><ul>
      <li>実際の入試では、先生が問題を1回だけ読み上げます。慣れてきたら「もういちど きく」を使わずに挑戦してみてください。</li>
      <li>記憶の問題は、絵を7秒だけ見せてから質問します。お話の記憶は読み上げを聞いてから答えます。</li>
      <li>正解数より「どう考えたか」を聞いてあげることが力になります。各分野のページに声かけのヒントがあります。</li>
      <li>記録（最高点）はこの端末のブラウザにだけ保存されます。</li>
      <li>2〜4さいの小さいお子さん向けには <a href="https://kfukuzumi1119-debug.github.io/kids-asobi/">あそんでまなぼ</a> もあります。</li>
    </ul></section>`;
  bindSound();
}
function startSection(id) {
  S = { id, qs: makeSet(id), i: 0, res: [] };
  showQ();
}
function frame(inner) {
  const s = S.id === 'mix' ? { t: 'ミックス', c: '#1F7A5A' } : SECTIONS[S.id];
  app.style.setProperty('--sc', s.c);
  app.innerHTML = topBar(`<a class="back" href="#">${ICON.home}もどる</a><h1 style="color:${s.c}">${s.t}</h1>`)
    + `<div class="prog">${S.qs.map((_, i) => `<i class="${i === S.i && S.i < PER_SET ? 'now' : ''}">${i < S.res.length ? (S.res[i] ? '○' : '×') : ''}</i>`).join('')}</div>` + inner
    + (S.id !== 'mix' ? `<details class="parents"><summary>おうちの方へ：この分野の声かけ</summary><p style="margin:8px 0 0">${SECTIONS[S.id].tip}</p></details>` : '');
  bindSound();
}
function showQ() {
  clearTimeout(timer); hush();
  const q = S.qs[S.i];
  if (q.pre && !q._preDone) return showPre(q);
  frame(`<section class="sheet"><div class="qhead"><span class="qno">${S.i + 1}</span><div class="qtext">${q.text}</div><button class="again" type="button" aria-label="もういちど きく">${ICON.speaker}</button></div>
    ${q.visual ? `<div class="visual">${q.visual}</div>` : ''}
    <div class="choices" style="--n:${Math.min(q.cols || q.choices.length, 4)}">${q.choices.map((c, i) => `<button class="choice" type="button" data-i="${i}" aria-label="${c.label || 'えらぶ'}">${c.html}${c.cap ? `<span class="cap">${c.label}</span>` : ''}</button>`).join('')}</div>
    <div class="fb" hidden></div></section>`);
  $('.again').onclick = () => say(q.text);
  say(q.text);
  const sheet = $('.sheet');
  $('.choices').onclick = e => {
    const b = e.target.closest('.choice'); if (!b || sheet.classList.contains('answered')) return;
    const i = +b.dataset.i, ok = i === q.answer, cs = [...sheet.querySelectorAll('.choice')];
    sheet.classList.add('answered'); S.res.push(ok); countAnswer(q, ok);
    cs[q.answer].insertAdjacentHTML('beforeend', MARK_OK);
    if (!ok) b.insertAdjacentHTML('beforeend', MARK_NG);
    const fb = $('.fb'); fb.hidden = false;
    const last = S.i === PER_SET - 1;
    fb.innerHTML = `<div class="res ${ok ? 'ok' : ''}">${ok ? '○ せいかい！' : '× ざんねん'}</div><p>${q.explain}</p>${!ok && q.story ? `<details><summary>おはなしを もういちど よむ</summary><p class="story">${q.story}</p></details>` : ''}
      <button class="go" type="button">${last ? 'けっかを みる' : 'つぎの もんだい'}</button>`;
    if (ok) { chime(); say('せいかい！'); } else { boop(); say('ざんねん。' + q.explain); }
    $('.prog').children[S.i].textContent = ok ? '○' : '×';
    $('.go', fb).onclick = () => { S.i++; S.i < PER_SET ? showQ() : showResult(); };
    fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
}
function showPre(q) {
  const done = () => { q._preDone = true; showQ(); };
  if (q.pre.story) {
    frame(`<section class="sheet pre"><div class="qhead"><span class="qno">${S.i + 1}</span><div class="qtext">おはなしを よく きいてね。あとで しつもんを するよ。</div></div>
      <div class="btns"><button class="go sub" type="button" id="play">${ICON.speaker} おはなしを きく</button><button class="go" type="button" id="toQ">しつもんへ すすむ</button></div>
      <details style="width:100%;text-align:left"><summary>おうちの方が読む場合はこちら（お子さんには見せずに読んでください）</summary><p class="story">${q.pre.story}</p></details></section>`);
    $('#play').onclick = () => say(q.pre.story);
    $('#toQ').onclick = done;
    say('おはなしを よく きいてね。' + q.pre.story);
    return;
  }
  frame(`<section class="sheet pre"><div class="qhead"><span class="qno">${S.i + 1}</span><div class="qtext">${q.pre.say}（${q.pre.sec}びょう）</div></div>
    <div class="timer"><i style="--t:${q.pre.sec}s"></i></div><div class="visual">${q.pre.html}</div></section>`);
  say(q.pre.say);
  timer = setTimeout(done, q.pre.sec * 1000);
}
function showResult() {
  hush();
  const n = S.res.filter(Boolean).length;
  saveSet(n);
  const msg = n === PER_SET ? 'ぜんもん せいかい！ すごい！' : n >= 8 ? 'よく できました！' : n >= 5 ? 'その ちょうし！' : 'まちがえた もんだいが いちばん べんきょうに なるよ';
  frame(`<section class="sheet result"><div class="score">${n}<small> / ${PER_SET}もん</small></div><div class="qtext" style="text-align:center">${msg}</div>
    <div class="marks">${S.res.map(r => `<span>${r ? '○' : '×'}</span>`).join('')}</div>
    <div class="btns"><button class="go" type="button" id="retry">もういちど（ちがう もんだい）</button><a class="go sub" href="#" style="text-decoration:none">ほかの ぶんや</a></div></section>`);
  if (n >= 8) chime();
  say(`${PER_SET}もん ちゅう ${n}もん せいかい。${msg}`);
  $('#retry').onclick = () => startSection(S.id);
}
const BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19V5M9 8h6"/></svg>';
const recPill = () => `<a class="pill" href="#kiroku" title="きろく">${BOOK}${esc(profName(profiles.find(p => p.id === pid)))}</a>`;
function renderRecord() {
  app.style.removeProperty('--sc');
  const cur = profiles.find(p => p.id === pid);
  const pct = t => t && t.ok + t.ng ? Math.round(t.ok / (t.ok + t.ng) * 100) : null;
  const when = ts => { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const all = Object.values(rec.secs).reduce((a, t) => ({ ok: a.ok + t.ok, ng: a.ng + t.ng }), { ok: 0, ng: 0 });
  const secName = id => id === 'mix' ? 'ミックス' : `${SECTIONS[id].t}（${SECTIONS[id].k}）`;
  const rows = ORDER.map(id => {
    const s = SECTIONS[id], t = rec.secs[id], r = pct(t), sets = rec.sets.filter(x => x.sec === id), last = sets[sets.length - 1];
    return `<tr><th><i style="background:${s.c}"></i>${s.k}</th><td>${r == null ? '—' : `${r}%<span class="bar"><b style="width:${r}%"></b></span>`}</td>
      <td>${t ? t.ok + t.ng : 0}</td><td>${sets.length}</td><td>${rec.best[id] != null ? rec.best[id] + '/' + PER_SET : '—'}</td><td>${last ? when(last.t).split(' ')[0] : '—'}</td></tr>`;
  }).join('');
  const weak = Object.entries(rec.types).filter(([, t]) => t.ok + t.ng >= 5 && pct(t) < 80).sort((a, b) => pct(a[1]) - pct(b[1])).slice(0, 3);
  const secOf = gen => ORDER.find(id => SECTIONS[id].g.some(g => g.name === gen));
  app.innerHTML = topBar(`<a class="back" href="#">${ICON.home}もどる</a><h1>きろく</h1>`) + `
    <section class="recbox"><h2>だれの きろく？</h2>
      <div class="profs">${profiles.map(p => `<button class="chip" type="button" data-pid="${p.id}" aria-pressed="${p.id === pid}">${esc(profName(p))}</button>`).join('')}<button class="chip" type="button" id="addProf">＋ ふやす</button></div>
      <div class="namerow"><label for="pname">なまえ</label><input id="pname" maxlength="12" value="${esc(cur.name)}" placeholder="れい：はなこ"><button class="chip" type="button" id="saveName">ほぞん</button></div>
    </section>
    <section class="stats">
      <div><b>${rec.sets.length}</b><span>やった かいすう（10もん）</span></div>
      <div><b>${all.ok + all.ng}</b><span>といた もんだい</span></div>
      <div><b>${pct(all) == null ? '—' : pct(all) + '%'}</b><span>せいかいりつ</span></div>
      <div><b>${rec.sets.length ? when(rec.sets[rec.sets.length - 1].t).split(' ')[0] : '—'}</b><span>さいごに やった ひ</span></div>
    </section>
    <section class="recbox"><h2>ぶんやごとの きろく</h2>
      <div class="tablewrap"><table class="rec"><thead><tr><th>分野</th><th>正答率</th><th>問題数</th><th>回数</th><th>最高</th><th>最後</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small">ミックスで解いた問題も、それぞれの分野に数えています。</p>
    </section>
    <section class="recbox"><h2>にがてかも？</h2>
      ${weak.length ? `<ul class="weak">${weak.map(([g, t]) => `<li><a href="#${secOf(g)}">${TYPE_LABEL[g] || g}</a><span>${SECTIONS[secOf(g)].k}・正答率 ${pct(t)}%（${t.ok + t.ng}問）</span></li>`).join('')}</ul>`
        : '<p class="small">同じ種類の問題を5問以上といて、正答率が80%より低いものがここに出ます。いまは ありません。</p>'}
    </section>
    <section class="recbox"><h2>さいきんの 10かい</h2>
      ${rec.sets.length ? `<ul class="hist">${rec.sets.slice(-10).reverse().map(x => `<li><span>${when(x.t)}</span><b>${secName(x.sec)}</b><em>${x.n}/${PER_SET}</em><span class="om">${x.res.map(r => r ? '○' : '×').join('')}</span></li>`).join('')}</ul>`
        : '<p class="small">10もん さいごまで やると ここに のこります。</p>'}
    </section>
    <div class="parents" style="border-style:dashed">記録はこの端末のこのブラウザにだけ保存されます（サーバーには送っていません）。ブラウザの履歴・サイトデータを消すと記録も消え、ほかのスマホとは共有されません。名前は「あそんでまなぼ」と共通です。
      <div class="btns" style="justify-content:flex-start;margin-top:10px"><button class="chip" type="button" id="resetRec">この人の きろくを けす</button>${profiles.length > 1 ? '<button class="chip" type="button" id="delProf">この人を けす</button>' : ''}</div></div>`;
  bindSound();
  app.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { pid = b.dataset.pid; saveProfiles(); loadRec(); renderRecord(); });
  $('#addProf').onclick = () => { const id = 'p' + Date.now(); profiles.push({ id, name: '' }); pid = id; saveProfiles(); loadRec(); renderRecord(); $('#pname').focus(); };
  $('#saveName').onclick = () => { cur.name = $('#pname').value.trim().slice(0, 12); saveProfiles(); renderRecord(); };
  $('#pname').onkeydown = e => { if (e.key === 'Enter') $('#saveName').click(); };
  // まちがえて けさないよう、2かい おしたときだけ けす
  const twice = (btn, label, act) => { let armed = 0; btn.onclick = () => { if (!armed) { btn.textContent = 'ほんとに けす？'; armed = setTimeout(() => { armed = 0; btn.textContent = label; }, 3000); return; } clearTimeout(armed); act(); }; };
  twice($('#resetRec'), 'この人の きろくを けす', () => { try { localStorage.removeItem('juken.rec.' + pid); } catch (e) {} rec = { best: {}, sets: [], types: {}, secs: {} }; saveRec(); renderRecord(); });
  if ($('#delProf')) twice($('#delProf'), 'この人を けす', () => {
    try { localStorage.removeItem('juken.rec.' + pid); localStorage.removeItem('asobi.rec.' + pid); } catch (e) {}
    profiles = profiles.filter(p => p.id !== pid); pid = profiles[0].id; saveProfiles(); loadRec(); renderRecord();
  });
}
function route() {
  clearTimeout(timer); hush();
  const id = location.hash.slice(1);
  if (id === 'kiroku') renderRecord(); else if (SECTIONS[id] || id === 'mix') startSection(id); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.addEventListener('pointerdown', () => actx(), { once: true });
route();
</script>
